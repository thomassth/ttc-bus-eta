name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0

      - name: npm ci, build and test
        run: |
          npm ci
          npm run build --if-present
